</button>
<button class="bg-surface-container h-24 border-3 border-on-surface flex items-center justify-center p-2 neo-shadow hover:bg-surface-container-high active:translate-y-0.5 transition-all">

</button>
<button class="bg-surface-container-highest h-24 border-3 border-on-surface flex items-center justify-center p-2 active-shadow translate-y-0.5 bg-primary-container/20">

<button class="bg-surface-container h-24 border-3 border-on-surface flex items-center justify-center p-2 neo-shadow hover:bg-surface-container-high active:translate-y-0.5 transition-all">

<span class="font-headline font-extrabold text-sm uppercase">MARGIN</span>
