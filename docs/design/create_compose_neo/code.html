<!DOCTYPE html>

<html lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>KNOTS - Compose Message</title>

                        "on-primary": "#ffffff",
                        "outline-variant": "#d8c3b1",

<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .neo-shadow {
            box-shadow: 4px 4px 0px 0px #1c1c15;
        }
        .neo-shadow-sm {
            box-shadow: 2px 2px 0px 0px #1c1c15;
        }
        body {
            background-color: #fcf9ee;
            font-family: 'Plus Jakarta Sans', sans-serif;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="min-h-screen flex flex-col overflow-x-hidden">
<!-- TopAppBar Shell -->
<header class="bg-[#D98C2F] dark:bg-[#895100] border-b-3 border-[#1c1c15] flex justify-between items-center w-full px-6 h-16 sticky top-0 z-50">
<div class="flex items-center gap-4">
<button class="flex items-center justify-center active:translate-y-0.5 transition-transform text-[#1c1c15]">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-['Plus_Jakarta_Sans'] font-extrabold uppercase tracking-[0.05em] text-xl text-[#1c1c15] dark:text-[#fcf9ee]">KNOTS</h1>
</div>
<div class="flex items-center gap-4">
<span class="material-symbols-outlined text-[#1c1c15] dark:text-[#fcf9ee]">account_circle</span>
</div>
</header>
<main class="flex-1 flex flex-col p-6 max-w-4xl mx-auto w-full mb-24">
<!-- Progress Indicator -->
<div class="mb-10 w-full flex items-center gap-2">
<div class="h-4 flex-1 bg-tertiary border-2 border-on-background"></div>
<div class="h-4 flex-1 bg-surface-container border-2 border-on-background"></div>
<div class="h-4 flex-1 bg-surface-container border-2 border-on-background"></div>
<span class="ml-4 font-label font-bold text-sm tracking-widest uppercase">Step 1/3</span>
</div>
<!-- Hero Text Section -->
<section class="mb-8">
<h2 class="text-4xl md:text-6xl font-headline font-extrabold uppercase tracking-tight leading-none mb-4 text-on-surface">
                Craft Your <span class="text-secondary">Secret</span>
</h2>
<p class="text-lg md:text-xl font-body font-medium text-on-surface-variant max-w-xl">
                The message you write here will be locked inside a grid. Your recipient must solve the pattern to read it.
            </p>
</section>
<!-- Compose Area -->
<div class="flex-1 flex flex-col gap-6">
<div class="relative group">
<!-- Label Pin -->
<div class="absolute -top-4 left-6 bg-secondary text-on-secondary px-4 py-1 border-2 border-on-background font-label font-bold text-xs tracking-tighter z-10">
                    MESSAGE_PAYLOAD
                </div>
<div class="bg-surface-container-low border-3 border-on-background p-1 neo-shadow">
<textarea class="w-full h-64 md:h-80 bg-surface border-2 border-on-background p-8 font-body font-semibold text-2xl md:text-3xl placeholder-on-surface/30 focus:outline-none focus:ring-0 resize-none leading-tight" placeholder="Write a message for Sam..."></textarea>
</div>
<!-- Character Counter / Meta -->
<div class="flex justify-between items-center mt-4">
<div class="flex gap-2">
<span class="bg-tertiary text-on-tertiary px-3 py-1 border-2 border-on-background font-label font-bold text-[10px] uppercase">LOCKED</span>
<span class="bg-surface-container-highest text-on-surface px-3 py-1 border-2 border-on-background font-label font-bold text-[10px] uppercase">ENCRYPTION: HARD</span>
</div>
<span class="font-label font-bold text-sm text-on-surface-variant">0 / 250</span>
</div>
</div>
</div>
<!-- Action Section -->
<div class="mt-12 flex flex-col md:flex-row gap-6 items-center">
<button class="w-full md:w-auto px-12 py-5 bg-tertiary text-on-tertiary border-3 border-on-background font-headline font-extrabold text-xl uppercase tracking-[0.1em] neo-shadow hover:translate-x-[-2px] hover:translate-y-[-2px] hover:shadow-[6px_6px_0px_0px_#1c1c15] active:translate-x-[2px] active:translate-y-[2px] active:shadow-none transition-all flex items-center justify-center gap-3">
                NEXT
                <span class="material-symbols-outlined font-bold">arrow_forward</span>
</button>
<button class="w-full md:w-auto px-8 py-5 bg-surface text-on-surface border-3 border-on-background font-headline font-bold text-lg uppercase tracking-widest hover:bg-surface-container transition-colors">
                SAVE DRAFT
            </button>
</div>
</main>
<!-- BottomNavBar Shell -->
<nav class="fixed bottom-0 left-0 w-full h-20 flex justify-around items-stretch bg-[#fcf9ee] dark:bg-[#1c1c15] border-t-3 border-[#1c1c15] z-50">
<a class="flex flex-col items-center justify-center text-[#857464] h-full w-full border-r-2 border-[#1c1c15] active:scale-95 transition-all hover:bg-[#f7f4e9] dark:hover:bg-[#1c1c15]" href="#">
<span class="material-symbols-outlined">mail</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold uppercase text-[10px] tracking-tighter">INBOX</span>
</a>
<a class="flex flex-col items-center justify-center text-[#857464] h-full w-full border-r-2 border-[#1c1c15] active:scale-95 transition-all hover:bg-[#f7f4e9] dark:hover:bg-[#1c1c15]" href="#">
<span class="material-symbols-outlined">extension</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold uppercase text-[10px] tracking-tighter">SOLVE</span>
</a>
<a class="flex flex-col items-center justify-center bg-[#D98C2F] text-[#1c1c15] h-full w-full border-r-2 border-[#1c1c15] active:scale-95 transition-all" href="#">
<span class="material-symbols-outlined">edit_square</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold uppercase text-[10px] tracking-tighter">CREATE</span>
</a>
<a class="flex flex-col items-center justify-center text-[#857464] h-full w-full last:border-r-0 active:scale-95 transition-all hover:bg-[#f7f4e9] dark:hover:bg-[#1c1c15]" href="#">
<span class="material-symbols-outlined">inventory_2</span>
<span class="font-['Plus_Jakarta_Sans'] font-bold uppercase text-[10px] tracking-tighter">VAULT</span>
</a>
</nav>
<!-- Contextual Aesthetic Elements (Neo-Brutalist Details) -->
<div class="fixed top-32 -right-12 w-48 h-48 border-3 border-on-background rotate-12 -z-10 opacity-10 pointer-events-none"></div>
<div class="fixed bottom-32 -left-12 w-64 h-64 border-3 border-secondary rotate-45 -z-10 opacity-10 pointer-events-none"></div>
